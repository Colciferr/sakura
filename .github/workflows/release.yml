name: Release Obsidian Plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Needed by the attestation step: id-token signs the provenance statement,
  # attestations stores it alongside the repository.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Obsidian's catalog requires the release tag to exactly equal the
      # manifest version (no "v" prefix) — fail fast on a mismatched tag.
      - name: Verify tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "${{ github.ref_name }}" != "$version" ]; then
            echo "Tag '${{ github.ref_name }}' does not match manifest.json version '$version'"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      # Build-provenance attestations let users (and Obsidian's review scan)
      # cryptographically verify that the release assets were produced by this
      # workflow from this repository's source.
      - name: Attest release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
